<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: transparent; }
    .track { fill: none; stroke: #322C27; stroke-width: 8; }
    .progress-1 { fill: none; stroke: #D8AE62; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 251.2; stroke-dashoffset: 12.56; }
    .progress-2 { fill: none; stroke: #FDECB2; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 251.2; stroke-dashoffset: 0; }
    .progress-3 { fill: none; stroke: #9C7844; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 251.2; stroke-dashoffset: 0; }
    .progress-4 { fill: none; stroke: #E8D091; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 251.2; stroke-dashoffset: 0; }
    .text { fill: #FFFFFF; font-family: sans-serif; font-size: 26px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
    .label { fill: #D8AE62; font-family: sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
  </style>

  <rect width="800" height="200" rx="15" class="bg" />

  <g transform="translate(130, 80)">
    <circle cx="0" cy="0" r="40" class="track" />
    <circle cx="0" cy="0" r="40" class="progress-1" transform="rotate(-90)" />
    <text x="0" y="2" class="text">95</text>
    <text x="0" y="65" class="label">Performance</text>
  </g>

  <g transform="translate(310, 80)">
    <circle cx="0" cy="0" r="40" class="track" />
    <circle cx="0" cy="0" r="40" class="progress-2" transform="rotate(-90)" />
    <text x="0" y="2" class="text">100</text>
    <text x="0" y="65" class="label">Accessibility</text>
  </g>

  <g transform="translate(490, 80)">
    <circle cx="0" cy="0" r="40" class="track" />
    <circle cx="0" cy="0" r="40" class="progress-3" transform="rotate(-90)" />
    <text x="0" y="2" class="text">100</text>
    <text x="0" y="65" class="label">Best Practices</text>
  </g>

  <g transform="translate(670, 80)">
    <circle cx="0" cy="0" r="40" class="track" />
    <circle cx="0" cy="0" r="40" class="progress-4" transform="rotate(-90)" />
    <text x="0" y="2" class="text">100</text>
    <text x="0" y="65" class="label">SEO</text>
  </g>
</svg>
